[project]
name = "wa-fake"
version = "0.1.0"
description = "SDK and pytest fixture for the local wa-fake simulator"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.entry-points.pytest11]
wa_fake = "wa_fake.pytest_plugin"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wa_fake"]
